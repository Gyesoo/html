<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 외부에서 전달받은 f를 n만큼 반복 호출한다.
        function repeat(n, f) {
            for (var i = 0; i < n; i++) {
                f(i); // i를 전달하면서 f를 호출
            }
        }

        var logAll = function (i) {
            console.log(i);
        };

        // 반복 호출할 함수를 인수로 전달한다.
        repeat(5, logAll);

        var logOdds = function (i) {
            if (i % 2) console.log(i);
        };

        // 반복 호출할 함수를 인수로 전달한다.
        repeat(5, logOdds);
    </script>
</body>
</html>
