<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var res = (function () {
            var a = 3;
            var b = 5;
            return a * b;
        }());

        console.log(res);

        res = (function (a, b) {
            return a * b;
        }(3, 5));

        console.log(res);
    </script>
</body>
</html>
