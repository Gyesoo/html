<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var add1 = (function () {
            var a = 10;
            return function (x, y) {
                return x + y + a;
            };
        }());
    
        console.log(add1(1, 2));

        var add2 = (function () {
            var a = 10;
            return new Function('x', 'y', 'return x + y + a;');
        }());

        console.log(add2(1, 2));
    </script>
</body>
</html>
