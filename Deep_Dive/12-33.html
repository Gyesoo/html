<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function changeVal(primitive, obj) {
            primitive += 100;
            obj.name = 'Kim';
            console.log(primitive, obj.name);
        }

        // 외부 상태
        var num = 100;
        var person = { name: 'Lee' };

        console.log(num);
        console.log(person);

        // 원시 값은 값 자체가 복사되어 전달되고 객체는 참조 값이 복사되어 전달된다.
        var per = changeVal(num, person);

        // 원시 값의 원본은 훼손되지 않는다.
        console.log(num);

        // 객체의 원본이 훼손된다.
        console.log(person);
    </script>
</body>
</html>
