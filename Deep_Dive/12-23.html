<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(x, y) {
            if (typeof x !== 'number' || typeof y !== 'number') {
                throw new TypeError('인수는 모두 숫자 값이어야 합니다.');
            }

            return x + y;
        }

        //console.log(add(2));
        //console.log(add('a', 'b'));
        console.log(add(1, 2));
    </script>
</body>
</html>
