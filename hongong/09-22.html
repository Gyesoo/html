<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var done = true;
        var message = '';

        // if...else 문
        if (done) message = '완료';
        else message = '미완료';
        console.log(message);

        // if...else 문은 삼향 조건 연산자로 대체 가능하다.
        message = done ? '완료' : '미완료';
        console.log(message);
    </script>
</body>
</html>
