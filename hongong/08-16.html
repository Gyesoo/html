<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var count = 0;

        // 무한루프
        while (true) {
            console.log(count);
            count++;

            // count가 3이면 코드 블록을 탈출한다.
            if (count === 3) break;
        }
    </script>
</body>
</html>
