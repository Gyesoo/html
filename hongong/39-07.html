<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="foo"></div>
    <script>
        let foo = 1;

        // id 값과 동일한 이름의 전역 변수가 이미 선언되어 있으며 노드 객체가 재할당되지 않는다.
        console.log(foo); // 1
    </script>
</body>
</html>
