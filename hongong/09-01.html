<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x = 10;

        // 명시적 타입 변환
        //  숫자를 문자열로 타입 캐스팅한다.
        var str = x.toString();
        console.log(typeof str, str);

        // x 변수의 값이 변경된 것이 아니다.
        console.log(typeof x, x);
    </script>
</body>
</html>
