<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="user" type="text" value="ungmo2">
    <script>
        // 요소 노드의 attribute 프로퍼티는 요소 노드의 모든 어트리뷰트 노드의 참조에 담긴 NameNodeMap 객체를 반환한다.
        const { attributes } = document.querySelector('#user');
        console.log(attributes);

        // 어트리뷰트 값 취득
        console.log(attributes.id.value);
        console.log(attributes.type.value);
        console.log(attributes.value.value);
    </script>
</body>
</html>
