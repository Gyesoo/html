<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var string = 'Hello world';
        var search = 'l';
        var index;

        // 문자열은 유사 배열이므로 for 문으로 순회할 수 있다.
        for (var i = 0; i < string.length; i++) {
            // 문자열의 개별 문자가 'l'이면
            if (string[i] === search) {
                index = i;
                break;
            }
        }

        document.write(i);
    </script>
</body>
</html>
