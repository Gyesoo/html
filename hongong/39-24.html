<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruits">
        <li> Apple</li>
        <li>Banana</li>
    </ul>
</body>
<script>
    const $fruits = document.querySelector('#fruits');

    // replaceChildren()을 호출하면 하위의 모든 자식 노드가 한 번에 깨끗하게 삭제됩니다.
    $fruits.replaceChildren();

    console.log($fruits.children); // HTMLCollection [] (length: 0)
</script>
</html>
