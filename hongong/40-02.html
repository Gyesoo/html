<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <button onclick="sayHi('Lee')">Click me!</button>
    <script>
        // 이벤트 핸들러 어트리뷰트 방식

            console.log(`Hi! ${name}.`);
        }
    </script>
