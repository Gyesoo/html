<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var count = 0;

        // count가 3 보다 작을 때에는 코드 블록을 계속 반복 실행한다.
        while (count < 3) {
            console.log(count);
            count++;
        }
    </script>
</body>
