<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruits">
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <script>
        const $fruits = document.querySelector('#fruits');

        // fruits 요소 노드 마지막 요소를 DOM에서 삭제
        $fruits.removeChild($fruits.lastElementChild);
    </script>
</body>
</html>
